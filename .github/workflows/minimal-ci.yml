# 同仓 push 入口。默认分支没有本文件时，手动派发事件收不到，所以入口不用它。
# 入口是已存在的 CI 分支 mayingjie/minimal-ci-8a30 上的 push。
# mac 标签字面量 self-hosted,macOS,ARM64,agentpulse
# windows 标签字面量 self-hosted,Windows,X64,agentpulse
# 被测源码树固定为 PR55 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf。
# 脚本版本是本次 push 的 github.sha。PR56 变绿不等于 PR55 原树通过。
# 新 runner 服务仍是 offline。本推送可能生成排队中的作业，但离线服务不会执行它。
# 不安装、不启动 runner，不设置 ready，不改仓库设置。

name: minimal-ci

on:
  push:
    branches:
      - mayingjie/minimal-ci-8a30

permissions:
  contents: read

concurrency:
  group: agentpulse-cli-minimal-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  darwin-native:
    name: darwin native
    if: "${{ github.event_name == 'push' && github.repository == 'mayingjie198448/agentpulse-cli' && github.ref == 'refs/heads/mayingjie/minimal-ci-8a30' && github.event.repository.fork == false }}"
    runs-on: [self-hosted, macOS, ARM64, agentpulse]
    timeout-minutes: 20
    steps:
      - name: checkout ci scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: checkout pr55 tree outside the script worktree
        shell: bash
        run: |
          git fetch --depth 1 https://github.com/mayingjie198448/agentpulse-cli.git 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          git worktree add --detach "$RUNNER_TEMP/pr55-target" 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          git -C "$RUNNER_TEMP/pr55-target" rev-parse HEAD
          git -C "$RUNNER_TEMP/pr55-target" status --porcelain
      - name: trust boundary
        id: trust
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TARGET_SHA: 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          TARGET_ROOT: ${{ runner.temp }}/pr55-target
          FORK: ${{ github.event.repository.fork }}
          ARTIFACT_DIR: ${{ runner.temp }}/agentpulse-darwin
        run: bash scripts/ci/trust-boundary.sh
      - name: darwin lane on pr55 tree
        shell: bash
        env:
          AGENTPULSE_CI_ENFORCE_SHA: "1"
          EXPECTED_SHA: ${{ github.sha }}
          TARGET_SHA: 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          TARGET_ROOT: ${{ runner.temp }}/pr55-target
          ARTIFACT_DIR: ${{ runner.temp }}/agentpulse-darwin
        run: bash scripts/ci/minimal-ci.sh
      - name: cross compile from pr55 tree
        if: steps.trust.outcome == 'success'
        shell: bash
        env:
          AGENTPULSE_CI_ENFORCE_SHA: "1"
          EXPECTED_SHA: ${{ github.sha }}
          TARGET_SHA: 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          TARGET_ROOT: ${{ runner.temp }}/pr55-target
          ARTIFACT_DIR: ${{ runner.temp }}/agentpulse-darwin-cross
        run: bash scripts/ci/minimal-ci.sh --cross-compile
      - name: upload darwin logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darwin-pr55-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agentpulse-darwin
            ${{ runner.temp }}/agentpulse-darwin-cross
          if-no-files-found: error

  windows-native:
    name: windows native
    if: "${{ github.event_name == 'push' && github.repository == 'mayingjie198448/agentpulse-cli' && github.ref == 'refs/heads/mayingjie/minimal-ci-8a30' && github.event.repository.fork == false }}"
    runs-on: [self-hosted, Windows, X64, agentpulse]
    timeout-minutes: 20
    steps:
      - name: checkout ci scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: checkout pr55 tree outside the script worktree
        shell: bash
        run: |
          git fetch --depth 1 https://github.com/mayingjie198448/agentpulse-cli.git 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          git worktree add --detach "$RUNNER_TEMP/pr55-target" 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          git -C "$RUNNER_TEMP/pr55-target" rev-parse HEAD
          git -C "$RUNNER_TEMP/pr55-target" status --porcelain
      - name: trust boundary
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TARGET_SHA: 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          TARGET_ROOT: ${{ runner.temp }}/pr55-target
          FORK: ${{ github.event.repository.fork }}
          ARTIFACT_DIR: ${{ runner.temp }}/agentpulse-windows
        run: bash scripts/ci/trust-boundary.sh
      - name: windows lane on pr55 tree
        shell: bash
        env:
          AGENTPULSE_CI_ENFORCE_SHA: "1"
          EXPECTED_SHA: ${{ github.sha }}
          TARGET_SHA: 9ac0b5c2ef21a9b77c501e67a8836e37a59e50bf
          TARGET_ROOT: ${{ runner.temp }}/pr55-target
          ARTIFACT_DIR: ${{ runner.temp }}/agentpulse-windows
        run: bash scripts/ci/minimal-ci.sh
      - name: upload windows logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-pr55-${{ github.run_id }}
          path: ${{ runner.temp }}/agentpulse-windows
          if-no-files-found: error
